[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adscout"
version = "0.1.0"
description = "AdScout + Pulse — competitive intelligence & feedback listening for Cloudplunge (internal tools)"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "typer==0.26.8",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.49.0",
    "jinja2==3.1.6",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
ai = ["anthropic>=0.40,<1.0"]
gmail = [
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "google-auth-httplib2==0.4.0",
]

[project.scripts]
adscout = "adscout.cli:main"
pulse = "pulse.cli:main"

[tool.setuptools.packages.find]
include = ["adscout*", "pulse*"]

[tool.setuptools.package-data]
adscout = ["migrations/*.sql", "web/templates/**/*.html", "web/static/*"]
pulse = ["migrations/*.sql", "web/templates/**/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
