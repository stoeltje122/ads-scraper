# page_ids staan bewust leeg: pagina's worden NOOIT gegokt.
# Gebruik `adscout resolve "<naam>"` en bevestig zelf de juiste pagina.
#
# category verwijst naar een advertiser_category (zie taxonomy.seed.yaml).
# Categorieën met "(verifiëren)" in de notities zijn onze inschatting.

