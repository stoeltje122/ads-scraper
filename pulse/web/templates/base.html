<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pulse{% endblock %} · Pulse</title>
<link rel="stylesheet" href="/static/pulse.css">
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/">Pulse<span>·Cloudplunge</span></a>
    <nav class="mainnav">
      <a href="/urgent" class="{{ 'active' if nav == 'urgent' else '' }}">Urgent{% if urgent_count %} <span class="nav-badge">{{ urgent_count }}</span>{% endif %}</a>
      <a href="/inbox" class="{{ 'active' if nav == 'inbox' else '' }}">Inbox</a>
      <a href="/trends" class="{{ 'active' if nav == 'trends' else '' }}">Trends</a>
      <a href="/kansen" class="{{ 'active' if nav == 'kansen' else '' }}">Kansen</a>
      <a href="/import" class="{{ 'active' if nav == 'import' else '' }}">Import</a>
      <a href="/beheer" class="{{ 'active' if nav == 'beheer' else '' }}">Beheer</a>
    </nav>
  </div>
</header>

<main class="container">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="container">
    <p>Alle data staat lokaal. Pulse geeft nooit medisch advies: gezondheidsmeldingen zijn markeringen voor jullie eigen opvolging.</p>
  </div>
</footer>
</body>
</html>
